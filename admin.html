<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Fully Working</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #111827;
            --card-border: #1f293d;
            --gold-primary: #d97706;
            --gold-light: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.25);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-cyan: #06b6d4;
            --danger-red: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }

        /* Lock Screen Overlay */
        #loginScreen {
            position: fixed; inset: 0; z-index: 999;
            background: rgba(11, 15, 25, 0.98);
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card {
            background: var(--card-bg); border: 1px solid var(--gold-primary);
            box-shadow: 0 0 25px var(--gold-glow); border-radius: 16px;
            padding: 30px; width: 100%; max-width: 360px; text-align: center;
        }
        .input-field {
            width: 100%; background: #070a12; border: 1px solid var(--card-border);
            border-radius: 10px; padding: 12px; color: #fff; text-align: center;
            font-size: 14px; outline: none; margin: 15px 0;
        }
        .btn-gold {
            width: 100%; background: linear-gradient(135deg, var(--gold-primary), var(--gold-light));
            color: #000; font-weight: bold; border: none; border-radius: 10px;
            padding: 12px; cursor: pointer; font-size: 14px;
        }

        /* Layout Styles */
        header {
            height: 60px; border-bottom: 1px solid var(--card-border);
            background: #0e1422; display: flex; align-items: center;
            justify-content: space-between; padding: 0 20px;
        }
        main { padding: 20px; height: calc(100vh - 60px); overflow-y: auto; }
        
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .filter-tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn {
            background: var(--card-bg); border: 1px solid var(--card-border);
            color: var(--text-muted); padding: 8px 16px; border-radius: 20px;
            font-size: 13px; cursor: pointer; white-space: nowrap;
        }
        .tab-btn.active { background: var(--gold-light); color: #000; font-weight: bold; }

        .table-container { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 500px; }
        th, td { padding: 14px; border-bottom: 1px solid var(--card-border); font-size: 14px; }
        th { background: #0e1422; color: var(--gold-light); text-transform: uppercase; font-size: 11px; }

        .action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 5px 10px; font-size: 14px; }
        .action-btn.edit:hover { color: var(--accent-cyan); }
        .action-btn.delete:hover { color: var(--danger-red); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 1. LOGIN OVERLAY -->
    <div id="loginScreen">
        <div class="login-card">
            <i class="fa-solid fa-crown" style="font-size: 30px; color: var(--gold-light);"></i>
            <h2 style="margin-top: 10px;">Admin Access</h2>
            <p style="font-size: 12px; color: var(--text-muted);">Enter password to continue</p>
            
            <input type="password" id="passInput" class="input-field" placeholder="Enter Password">
            <p id="errorText" style="color: var(--danger-red); font-size: 12px; margin-bottom: 10px;" class="hidden">Wrong Password!</p>
            
            <button id="loginBtn" class="btn-gold">UNLOCK</button>
        </div>
    </div>

    <!-- 2. MAIN DASHBOARD -->
    <div id="adminContent" class="hidden">
        <header>
            <div style="color: var(--gold-light); font-weight: bold;"><i class="fa-solid fa-shield"></i> VIP ADMIN</div>
            <button id="logoutBtn" style="background: var(--danger-red); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">Lock</button>
        </header>

        <main>
            <div class="page-header">
                <h2>Categories Management</h2>
                <button id="addCatBtn" class="btn-gold" style="width: auto; padding: 8px 16px;"><i class="fa-solid fa-plus"></i> Add New</button>
            </div>

            <!-- Category Filter Tabs -->
            <div class="filter-tabs">
                <button class="tab-btn active" data-filter="All">All</button>
                <button class="tab-btn" data-filter="Mathematics">Mathematics</button>
                <button class="tab-btn" data-filter="Ethical Hacking">Ethical Hacking</button>
                <button class="tab-btn" data-filter="App Development">App Development</button>
                <button class="tab-btn" data-filter="Web Development">Web Development</button>
            </div>

            <!-- Table -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Category Name</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th style="text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="catTableBody">
                        <tr data-category="Mathematics">
                            <td><strong class="cat-name">Mathematics</strong></td>
                            <td style="color: #10b981;">Active (7 Items)</td>
                            <td style="color: var(--text-muted);">2026-08-25</td>
                            <td style="text-align: right;">
                                <button class="action-btn edit"><i class="fa-solid fa-pen"></i></button>
                                <button class="action-btn delete"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                        <tr data-category="Ethical Hacking">
                            <td><strong class="cat-name">Ethical Hacking</strong></td>
                            <td style="color: #10b981;">Active (1 Item)</td>
                            <td style="color: var(--text-muted);">2026-08-25</td>
                            <td style="text-align: right;">
                                <button class="action-btn edit"><i class="fa-solid fa-pen"></i></button>
                                <button class="action-btn delete"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                        <tr data-category="App Development">
                            <td><strong class="cat-name">App Development</strong></td>
                            <td style="color: #10b981;">Active (2 Items)</td>
                            <td style="color: var(--text-muted);">2026-08-25</td>
                            <td style="text-align: right;">
                                <button class="action-btn edit"><i class="fa-solid fa-pen"></i></button>
                                <button class="action-btn delete"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                        <tr data-category="Web Development">
                            <td><strong class="cat-name">Web Development</strong></td>
                            <td style="color: #10b981;">Active (3 Items)</td>
                            <td style="color: var(--text-muted);">2026-08-25</td>
                            <td style="text-align: right;">
                                <button class="action-btn edit"><i class="fa-solid fa-pen"></i></button>
                                <button class="action-btn delete"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- 3. ALL FIXED JAVASCRIPT FUNCTIONS -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const ADMIN_PASSWORD = "admin123";

            // 1. Password Verification Function
            function verifyPassword() {
                const input = document.getElementById("passInput").value;
                const errorText = document.getElementById("errorText");
                
                if (input === ADMIN_PASSWORD) {
                    document.getElementById("loginScreen").classList.add("hidden");
                    document.getElementById("adminContent").classList.remove("hidden");
                    errorText.classList.add("hidden");
                } else {
                    errorText.classList.remove("hidden");
                }
            }

            document.getElementById("loginBtn").addEventListener("click", verifyPassword);
            document.getElementById("passInput").addEventListener("keyup", function(e) {
                if(e.key === "Enter") verifyPassword();
            });

            // 2. Lock / Logout Function
            document.getElementById("logoutBtn").addEventListener("click", function() {
                document.getElementById("passInput").value = "";
                document.getElementById("adminContent").classList.add("hidden");
                document.getElementById("loginScreen").classList.remove("hidden");
            });

            // 3. Category Filter Tabs Function
            const tabBtns = document.querySelectorAll(".tab-btn");
            tabBtns.forEach(btn => {
                btn.addEventListener("click", function() {
                    tabBtns.forEach(b => b.classList.remove("active"));
                    this.classList.add("active");

                    const filter = this.getAttribute("data-filter");
                    const rows = document.querySelectorAll("#catTableBody tr");

                    rows.forEach(row => {
                        const category = row.getAttribute("data-category");
                        if (filter === "All" || category === filter) {
                            row.style.display = "";
                        } else {
                            row.style.display = "none";
                        }
                    });
                });
            });

            // 4. Add New Category Function
            document.getElementById("addCatBtn").addEventListener("click", function() {
                let name = prompt("Enter new category name:");
                if (name && name.trim() !== "") {
                    let tableBody = document.getElementById("catTableBody");
                    let newRow = document.createElement("tr");
                    newRow.setAttribute("data-category", name);
                    newRow.innerHTML = `
                        <td><strong class="cat-name">${name}</strong></td>
                        <td style="color: #10b981;">Active (0 Items)</td>
                        <td style="color: var(--text-muted);">2026-08-25</td>
                        <td style="text-align: right;">
                            <button class="action-btn edit"><i class="fa-solid fa-pen"></i></button>
                            <button class="action-btn delete"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    tableBody.appendChild(newRow);
                    attachActionEvents(newRow);
                }
            });

            // 5. Dynamic Edit & Delete Handlers
            function attachActionEvents(row) {
                const editBtn = row.querySelector(".edit");
                const deleteBtn = row.querySelector(".delete");

                editBtn.addEventListener("click", function() {
                    let catNameEl = row.querySelector(".cat-name");
                    let currentName = catNameEl.innerText;
                    let newName = prompt("Edit category name:", currentName);
                    
                    if (newName && newName.trim() !== "") {
                        catNameEl.innerText = newName;
                        row.setAttribute("data-category", newName);
                    }
                });

                deleteBtn.addEventListener("click", function() {
                    if (confirm("Are you sure you want to delete this category?")) {
                        row.remove();
                    }
                });
            }

            // Bind Edit/Delete for existing rows
            document.querySelectorAll("#catTableBody tr").forEach(attachActionEvents);
        });
    </script>
</body>
</html>
