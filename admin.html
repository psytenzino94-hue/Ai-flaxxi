<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flaxxi AI - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        .gold-border { border-color: #d97706; }
        .gold-text { color: #f59e0b; }
        .gold-btn { background: linear-gradient(135deg, #d97706, #b45309); }
        .gold-btn:hover { background: linear-gradient(135deg, #b45309, #92400e); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Login Box -->
    <div id="loginBox" class="w-full max-w-md bg-slate-900 rounded-2xl shadow-2xl border gold-border p-6 space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold gold-text flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-shield"></i> Admin Panel Login
            </h1>
            <p class="text-xs text-slate-400">Secure Admin Authentication</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Admin Password</label>
                <input type="password" id="adminPassword" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 transition" placeholder="Enter password...">
            </div>

            <button onclick="checkLogin()" class="w-full gold-btn text-white font-semibold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-lock-open"></i> Login to Admin
            </button>
            
            <div class="text-center">
                <a href="index.html" class="text-xs text-slate-400 hover:text-amber-400"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard (Hidden by default) -->
    <div id="dashboardBox" class="hidden w-full max-w-2xl bg-slate-900 rounded-2xl shadow-2xl border gold-border p-6 space-y-6">
        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <h1 class="text-xl font-bold gold-text flex items-center gap-2">
                <i class="fa-solid fa-gauge-high"></i> Admin Dashboard
            </h1>
            <button onclick="logoutAdmin()" class="text-xs bg-red-500/10 text-red-400 px-3 py-1.5 rounded-lg border border-red-500/20">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                <div class="text-sm text-slate-400">Total Users / Visitors</div>
                <div class="text-2xl font-bold text-amber-400">1,245</div>
            </div>
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                <div class="text-sm text-slate-400">System Status</div>
                <div class="text-2xl font-bold text-emerald-400">Active & Online</div>
            </div>
        </div>

        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
            <h3 class="text-sm font-semibold text-slate-300"><i class="fa-solid fa-sliders"></i> Quick Controls</h3>
            <button onclick="alert('System cache cleared successfully!')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-4 py-2 rounded-lg border border-slate-700">
                Clear System Cache
            </button>
        </div>
    </div>

    <script>
        const CORRECT_PASSWORD = "Tenzino766";

        function checkLogin() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === CORRECT_PASSWORD) {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('dashboardBox').classList.remove('hidden');
            } else {
                alert('Galat password!');
            }
        }

        function logoutAdmin() {
            document.getElementById('adminPassword').value = '';
            document.getElementById('dashboardBox').classList.add('hidden');
            document.getElementById('loginBox').classList.remove('hidden');
        }
    </script>
</body>
</html>
