<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flaxxi AI - User Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        .gold-border { border-color: #d97706; }
        .gold-text { color: #f59e0b; }
        .gold-btn { background: linear-gradient(135deg, #d97706, #b45309); }
        .gold-btn:hover { background: linear-gradient(135deg, #b45309, #92400e); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl bg-slate-800 rounded-2xl shadow-2xl border gold-border p-6 space-y-6">
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-700 pb-4">
            <h1 class="text-2xl font-bold gold-text flex items-center gap-2">
                <i class="fa-solid fa-bolt"></i> Flaxxi AI
            </h1>
            <div class="flex items-center gap-2">
                <a href="admin.html" class="text-slate-400 hover:text-amber-400 p-2 rounded-lg bg-slate-700/50 border border-slate-600" title="Open Admin Panel">
                    <i class="fa-solid fa-user-shield"></i>
                </a>
                <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-500/20">Online</span>
            </div>
        </div>

        <!-- Input Area -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Apna Sawal Likhie</label>
                <textarea id="userInput" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 transition" placeholder="Type message..."></textarea>
            </div>

            <div class="flex gap-2">
                <button onclick="sendInstantMessage()" class="flex-1 gold-btn text-white font-semibold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> Ask Flaxxi
                </button>
                <button onclick="startVoiceInput()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-4 py-3 rounded-xl transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-microphone" id="micIcon"></i>
                </button>
                <button onclick="clearText()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 font-semibold px-4 py-3 rounded-xl transition">
                    Clear
                </button>
            </div>
        </div>

        <!-- Output Box -->
        <div class="space-y-2">
            <div class="flex items-center justify-between">
                <label class="block text-sm font-medium text-slate-400">Response</label>
                <button onclick="speakResponse()" class="text-amber-500 hover:text-amber-400 text-xs flex items-center gap-1 bg-amber-500/10 px-2 py-1 rounded border border-amber-500/20">
                    <i class="fa-solid fa-volume-high"></i> Read aloud
                </button>
            </div>
            <pre id="outputBox" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 min-h-[120px] max-h-[320px] overflow-y-auto text-slate-200 text-sm font-mono whitespace-pre-wrap">Waiting for input...</pre>
        </div>
    </div>

    <script>
        function sendInstantMessage() {
            const input = document.getElementById('userInput').value.trim();
            const outputBox = document.getElementById('outputBox');

            if (!input) {
                outputBox.innerText = "Kripya koi question type karein.";
                return;
            }

            let reply = "";
            const text = input.toLowerCase();

            if (text.includes("kisne banaya") || text.includes("who made you")) {
                reply = "Mujhe Tenzino ne banaya hai!";
            } 
            else if (text.includes("carrom") || text.includes("game")) {
                reply = `Carrom / 2D Aim Line Guide Script (HTML Canvas):\n\n` +
`<!DOCTYPE html>\n<html>\n<head>\n  <style>\n    canvas { background: #15803d; border: 4px solid #78350f; border-radius: 50%; }\n  </style>\n</head>\n<body style="display:flex; justify-content:center;">\n  <canvas id="carrom" width="300" height="300"></canvas>\n  <script>\n    const ctx = document.getElementById('carrom').getContext('2d');\n    // Striker & Aim guide line\n    ctx.beginPath(); ctx.arc(150, 240, 15, 0, Math.PI*2); ctx.fillStyle='white'; ctx.fill();\n    ctx.beginPath(); ctx.moveTo(150, 240); ctx.lineTo(150, 60); ctx.strokeStyle='yellow'; ctx.lineWidth=2; ctx.stroke();\n  <\/script>\n</body>\n</html>`;
            }
            else if (text.includes("youtube") || text.includes("movie")) {
                reply = `YouTube / Video Player Script:\n\n` +
`<!DOCTYPE html>\n<html>\n<body style="background:#0f172a; color:white; font-family:sans-serif; text-align:center;">\n  <h2>Flaxxi Video App</h2>\n  <iframe width="100%" height="220" src="https://www.youtube.com/embed/tgbNymZ7vqY"></iframe>\n</body>\n</html>`;
            }
            else if (text.includes("hello") || text.includes("hi")) {
                reply = "Namaste! Main Flaxxi AI hoon. Main aapki kya madad kar sakta hoon?";
            } 
            else {
                reply = `Flaxxi AI Engine Result:\n\nTopic: ${input}\nStatus: Direct Solution Generated!\n\nKaam shuru karne ke liye niche diya HTML setup use karein:\n\n<!DOCTYPE html>\n<html>\n<head><title>${input}</title></head>\n<body style="background:#0b0f19; color:#fff; font-family:sans-serif; padding:20px;">\n  <h1>Flaxxi AI: ${input}</h1>\n  <p>Tenzino ke dwara banaya gaya full template system ready hai.</p>\n</body>\n</html>`;
            }

            outputBox.innerText = reply;
        }

        function clearText() {
            document.getElementById('userInput').value = '';
            document.getElementById('outputBox').innerText = 'Waiting for input...';
        }

        function startVoiceInput() {
            const recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!recognition) return alert("Browser voice input support nahi karta.");
            const rec = new recognition();
            rec.lang = 'hi-IN';
            const micIcon = document.getElementById('micIcon');
            micIcon.className = 'fa-solid fa-spinner fa-spin';

            rec.onresult = (e) => {
                document.getElementById('userInput').value = e.results[0][0].transcript;
                micIcon.className = 'fa-solid fa-microphone';
                sendInstantMessage();
            };
            rec.onerror = () => micIcon.className = 'fa-solid fa-microphone';
            rec.start();
        }

        function speakResponse() {
            const text = document.getElementById('outputBox').innerText;
            if (!text || text === "Waiting for input...") return;
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'hi-IN';
            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
