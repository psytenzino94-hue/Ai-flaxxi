<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flaxxi AI - Full App Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        .gold-border { border-color: #d97706; }
        .gold-text { color: #f59e0b; }
        .gold-btn { background: linear-gradient(135deg, #d97706, #b45309); }
        .gold-btn:hover { background: linear-gradient(135deg, #b45309, #92400e); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-slate-900 rounded-2xl shadow-2xl border gold-border p-6 space-y-6">
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold gold-text flex items-center gap-2">
                <i class="fa-solid fa-bolt"></i> Flaxxi AI <span class="text-xs text-slate-400 font-normal">Full App Generator</span>
            </h1>
            <div class="flex items-center gap-2">
                <a href="admin.html" class="text-slate-400 hover:text-amber-400 p-2 rounded-lg bg-slate-800 border border-slate-700" title="Open Admin Panel">
                    <i class="fa-solid fa-user-shield"></i>
                </a>
                <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-500/20">Engine Active</span>
            </div>
        </div>

        <!-- Input Section -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Aapko kya app, game ya tool banana hai?</label>
                <textarea id="userInput" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 transition" placeholder="Jaise: Carrom Aim Hack App, YouTube Video Player, Calculator, etc..."></textarea>
            </div>

            <div class="flex gap-2">
                <button onclick="generateFullApp()" class="flex-1 gold-btn text-white font-semibold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Full App Code
                </button>
                <button onclick="startVoiceInput()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-4 py-3 rounded-xl transition flex items-center justify-center">
                    <i class="fa-solid fa-microphone" id="micIcon"></i>
                </button>
                <button onclick="clearText()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-4 py-3 rounded-xl transition">
                    Clear
                </button>
            </div>
        </div>

        <!-- Output & Full Code Display Section -->
        <div class="space-y-3">
            <div class="flex items-center justify-between">
                <label class="block text-sm font-medium text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-code"></i> Full Ready-to-Use App Source Code
                </label>
                <div class="flex gap-2">
                    <button onclick="copyCode()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1">
                        <i class="fa-solid fa-copy"></i> Copy Code
                    </button>
                    <button onclick="speakResponse()" class="text-xs bg-amber-500/10 text-amber-400 px-3 py-1.5 rounded-lg border border-amber-500/20 flex items-center gap-1">
                        <i class="fa-solid fa-volume-high"></i> Read
                    </button>
                </div>
            </div>
            
            <textarea id="outputBox" readonly class="w-full h-64 bg-slate-950 border border-slate-800 rounded-xl p-4 text-emerald-400 font-mono text-xs leading-relaxed focus:outline-none resize-y" placeholder="Aapka full code yahan generate hoga..."></textarea>
        </div>
    </div>

    <script>
        function generateFullApp() {
            const input = document.getElementById('userInput').value.trim();
            const outputBox = document.getElementById('outputBox');

            if (!input) {
                outputBox.value = "Kripya batayein aapko kaun sa app ya tool banana hai.";
                return;
            }

            const query = input.toLowerCase();
            let fullAppCode = "";

            if (query.includes("carrom") || query.includes("hack") || query.includes("aim")) {
                fullAppCode = 
`<!-- ========================================== -->
<!-- FLAXXI AI GENERATED FULL APP: CARROM AIM TOOL -->
<!-- Created for Tenzino Platform -->
<!-- ========================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrom Pro Aim Master</title>
    <style>
        body { background: #090d16; color: white; text-align: center; font-family: sans-serif; padding: 20px; }
        .board { width: 320px; height: 320px; background: #15803d; border: 8px solid #78350f; border-radius: 50%; margin: 20px auto; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .striker { width: 35px; height: 35px; background: white; border-radius: 50%; position: absolute; bottom: 30px; left: 142px; border: 2px solid #333; }
        .aim-line { position: absolute; bottom: 65px; left: 158px; width: 4px; height: 180px; background: #facc15; transform-origin: bottom center; box-shadow: 0 0 10px #facc15; }
        .btn { background: #d97706; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Carrom Aim & Guide Tool</h2>
    <div class="board">
        <div class="aim-line" id="aimLine"></div>
        <div class="striker" id="striker"></div>
    </div>
    <button class="btn" onclick="adjustAim()">Rotate Aim Line</button>

    <script>
        let angle = 0;
        function adjustAim() {
            angle = (angle + 15) % 60 - 30;
            document.getElementById('aimLine').style.transform = \`rotate(\${angle}deg)\`;
        }
    <\/script>
</body>
</html>`;
            } 
            else if (query.includes("youtube") || query.includes("video") || query.includes("movie")) {
                fullAppCode = 
`<!-- ========================================== -->
<!-- FLAXXI AI GENERATED FULL APP: VIDEO STREAMER -->
<!-- ========================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flaxxi Video Streamer</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; margin: 0; padding: 20px; text-align: center; }
        .video-box { background: #1e293b; padding: 15px; border-radius: 12px; max-width: 500px; margin: 20px auto; border: 1px solid #334155; }
        iframe { width: 100%vh; height: 250px; border-radius: 8px; border: none; }
    </style>
</head>
<body>
    <h1>Flaxxi Tube Hub</h1>
    <div class="video-box">
        <h3>Featured Stream</h3>
        <iframe src="https://www.youtube.com/embed/tgbNymZ7vqY"></iframe>
    </div>
</body>
</html>`;
            } 
            else {
                fullAppCode = 
`<!-- ========================================== -->
<!-- FLAXXI AI GENERATED FULL APP FOR: ${input.toUpperCase()} -->
<!-- Creator: Tenzino Ecosystem -->
<!-- ========================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${input}</title>
    <style>
        body { background: #0b0f19; color: #f8fafc; font-family: 'Segoe UI', sans-serif; padding: 20px; text-align: center; }
        .card { background: #111827; border: 1px solid #d97706; padding: 30px; border-radius: 16px; max-width: 500px; margin: 40px auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #f59e0b; }
        .action-btn { background: #d97706; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>${input}</h1>
        <p>Aapke diye gaye topic par yeh complete application template taiyar kiya gaya hai.</p>
        <button class="action-btn" onclick="alert('App is running successfully!')">Test App Action</button>
    </div>
</body>
</html>`;
            }

            outputBox.value = fullAppCode;
        }

        function copyCode() {
            const outputBox = document.getElementById('outputBox');
            if(!outputBox.value) return alert("Pehle code generate karein!");
            outputBox.select();
            document.execCommand('copy');
            alert('Full App Code Copied Successfully!');
        }

        function clearText() {
            document.getElementById('userInput').value = '';
            document.getElementById('outputBox').value = '';
        }

        function startVoiceInput() {
            const recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!recognition) return alert("Browser voice input support nahi karta.");
            const rec = new recognition();
            rec.lang = 'hi-IN';
            const micIcon = document.getElementById('micIcon');
            micIcon.className = 'fa-solid fa-spinner fa-spin';

            rec.onresult = (e) => {
                document.getElementById('userInput').value = e.results[0][0].transcript;
                micIcon.className = 'fa-solid fa-microphone';
                generateFullApp();
            };
            rec.onerror = () => micIcon.className = 'fa-solid fa-microphone';
            rec.start();
        }

        function speakResponse() {
            const text = document.getElementById('outputBox').value;
            if (!text) return alert("Koi code read karne ke liye nahi hai.");
            const speech = new SpeechSynthesisUtterance("Aapka full application code generate ho chuka hai.");
            speech.lang = 'hi-IN';
            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
