<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flaxxi AI - Multi-Language Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        .gold-border { border-color: #d97706; }
        .gold-text { color: #f59e0b; }
        .gold-btn { background: linear-gradient(135deg, #d97706, #b45309); }
        .gold-btn:hover { background: linear-gradient(135deg, #b45309, #92400e); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-slate-900 rounded-2xl shadow-2xl border gold-border p-6 space-y-6">
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold gold-text flex items-center gap-2">
                <i class="fa-solid fa-bolt"></i> Flaxxi AI
            </h1>
            <div class="flex items-center gap-2">
                <a href="admin.html" class="text-slate-400 hover:text-amber-400 p-2 rounded-lg bg-slate-800 border border-slate-700" title="Open Admin Panel">
                    <i class="fa-solid fa-user-shield"></i>
                </a>
                <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-500/20">Online</span>
            </div>
        </div>

        <!-- Input Section -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Apna Sawal Likhie</label>
                <textarea id="userInput" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 transition" placeholder="Mujhe carrom pool aim hack bana he full guide do c++ code..."></textarea>
            </div>

            <!-- Image Preview Area -->
            <div id="imagePreviewContainer" class="hidden flex items-center gap-3 bg-slate-950 p-2 rounded-xl border border-slate-800">
                <img id="imagePreview" src="" class="w-12 h-12 object-cover rounded-lg border border-amber-500" alt="Uploaded Image">
                <div class="flex-1 text-xs text-slate-300 truncate" id="imageName">image.jpg</div>
                <button onclick="removeImage()" class="text-red-400 hover:text-red-300 p-2"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="flex flex-wrap gap-2 items-center">
                <button onclick="processAIResponse()" class="flex-1 gold-btn text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> Ask Flaxxi
                </button>

                <label class="bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 font-semibold px-4 py-3 rounded-xl transition cursor-pointer flex items-center justify-center gap-2">
                    <i class="fa-solid fa-image"></i> Add Photo
                    <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                </label>

                <button onclick="startVoiceInput()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-4 py-3 rounded-xl transition flex items-center justify-center">
                    <i class="fa-solid fa-microphone" id="micIcon"></i>
                </button>

                <button onclick="clearText()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-4 py-3 rounded-xl transition">
                    Clear
                </button>
            </div>
        </div>

        <!-- Output & Controls -->
        <div class="space-y-3">
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
                <label class="block text-sm font-medium text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-message"></i> Response
                </label>
                
                <div class="flex flex-wrap items-center gap-1.5 w-full sm:w-auto">
                    <!-- Language Selector -->
                    <select id="langSelect" onchange="loadVoices()" class="bg-slate-950 text-slate-300 text-xs border border-slate-800 rounded-lg px-2 py-1.5 focus:outline-none max-w-[100px]">
                        <option value="hi-IN">Hindi</option>
                        <option value="en-US">English</option>
                        <option value="ne-NP">Nepali</option>
                        <option value="es-ES">Spanish</option>
                    </select>

                    <!-- Multiple Voice Select Dropdown -->
                    <select id="voiceSelect" class="bg-slate-950 text-slate-300 text-xs border border-slate-800 rounded-lg px-2 py-1.5 focus:outline-none max-w-[95px] truncate">
                        <option value="">Default Voice</option>
                    </select>

                    <!-- Play / Stop Button -->
                    <button id="playBtn" onclick="toggleAudio()" class="text-xs bg-amber-500/10 text-amber-400 px-2.5 py-1.5 rounded-lg border border-amber-500/20 flex items-center gap-1 font-semibold">
                        <i id="playIcon" class="fa-solid fa-play"></i> <span id="playText">Play</span>
                    </button>

                    <!-- Copy Button -->
                    <button onclick="copyCode()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1">
                        <i class="fa-solid fa-copy"></i> Copy
                    </button>
                </div>
            </div>
            
            <textarea id="outputBox" readonly class="w-full h-64 bg-slate-950 border border-slate-800 rounded-xl p-4 text-slate-200 font-mono text-xs leading-relaxed focus:outline-none resize-y" placeholder="Flaxxi AI ka javab yahan dikhega..."></textarea>
        </div>
    </div>

    <script>
        let uploadedImageBase64 = "";
        let availableVoices = [];
        let isSpeaking = false;

        function loadVoices() {
            if (typeof speechSynthesis === 'undefined') return;
            availableVoices = window.speechSynthesis.getVoices();
            const voiceSelect = document.getElementById('voiceSelect');
            const selectedLang = document.getElementById('langSelect').value;
            voiceSelect.innerHTML = '<option value="">Default Voice</option>';

            const filteredVoices = availableVoices.filter(v => v.lang.toLowerCase().includes(selectedLang.substring(0,2).toLowerCase()));
            const voiceList = filteredVoices.length > 0 ? filteredVoices : availableVoices;

            voiceList.forEach((voice) => {
                const index = availableVoices.indexOf(voice);
                const option = document.createElement('option');
                option.value = index;
                option.innerText = `${voice.name}`;
                voiceSelect.appendChild(option);
            });
        }

        if (typeof speechSynthesis !== 'undefined') {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            setTimeout(loadVoices, 500);
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageBase64 = e.target.result;
                    document.getElementById('imagePreview').src = uploadedImageBase64;
                    document.getElementById('imageName').innerText = file.name;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            uploadedImageBase64 = "";
            document.getElementById('imageInput').value = "";
            document.getElementById('imagePreviewContainer').classList.add('hidden');
        }

        function processAIResponse() {
            stopAudio();
            const input = document.getElementById('userInput').value.trim();
            const outputBox = document.getElementById('outputBox');
            const currentLang = document.getElementById('langSelect').value;

            if (!input && !uploadedImageBase64) {
                outputBox.value = "Kripya koi question likhein ya photo upload karein.";
                return;
            }

            const query = input.toLowerCase();
            let responseText = "";

            // Check if user asked for C++ with Guide
            if ((query.includes("c++") || query.includes("cpp")) && (query.includes("guide") || query.includes("hack") || query.includes("aim"))) {
                responseText = 
`=== CARROM POOL AIM ASSIST: FULL GUIDE & C++ CODE ===

[STEP 1: SYSTEM REQUIREMENTS]
1. Install C++ Compiler (GCC / Clang / Visual Studio).
2. Install OpenCV Library (Visual Tracking aur Screen Overlay ke liye).

[STEP 2: OVERLAY & AIM ALGORITHM LOGIC]
- Screen se Game Board Coordinates calculate hotey hain.
- Striker position aur Pocket Position ke beech Trajectory Line draw hoti hai.

[STEP 3: COMPLETE C++ SOURCE CODE]

#include <iostream>
#include <cmath>

struct Vector2D {
    float x, y;
};

// Calculate Aim Line Prediction Point
Vector2D calculateAimPoint(Vector2D striker, Vector2D puck, Vector2D pocket) {
    float angle = atan2(pocket.y - puck.y, pocket.x - puck.x);
    Vector2D targetPos;
    float puckRadius = 15.0f; // Radius setup
    
    targetPos.x = puck.x - cos(angle) * (puckRadius * 2);
    targetPos.y = puck.y - sin(angle) * (puckRadius * 2);
    
    return targetPos;
}

int main() {
    std::cout << "--- FLAXXI AI CARROM AIM BOT LAUNCHED ---" << std::endl;
    
    Vector2D striker = { 150.0f, 50.0f };
    Vector2D puck = { 150.0f, 200.0f };
    Vector2D pocket = { 300.0f, 300.0f };

    Vector2D aimTarget = calculateAimPoint(striker, puck, pocket);

    std::cout << "[Aim Bot Output] Calculated Aim Line Target:" << std::endl;
    std::cout << "X Coordinates: " << aimTarget.x << ", Y Coordinates: " << aimTarget.y << std::endl;

    return 0;
}

[STEP 4: HOW TO RUN]
1. Code ko 'aimbot.cpp' naam se save karein.
2. Terminal me execute karein: g++ aimbot.cpp -o aimbot && ./aimbot`;
            } 
            else if (uploadedImageBase64 || query.includes("html") || query.includes("app bana")) {
                responseText = 
`=== CARROM AIM APP: GUIDE & CODE ===

[STEP 1: Web Browser App setup]
[STEP 2: HTML Overlay Screen]

<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #0b0f19; color: white; text-align: center; font-family: sans-serif; }
        .board { width: 280px; height: 280px; background: #15803d; border: 6px solid #78350f; border-radius: 50%; margin: 20px auto; position: relative; }
        .striker { width: 30px; height: 30px; background: white; border-radius: 50%; position: absolute; bottom: 20px; left: 125px; }
        .aim-line { position: absolute; bottom: 50px; left: 139px; width: 3px; height: 160px; background: #facc15; }
    </style>
</head>
<body>
    <h3>Carrom Aim Tool</h3>
    <div class="board"><div class="aim-line"></div><div class="striker"></div></div>
</body>
</html>`;
            } 
            else if (query.includes("hlo") || query.includes("hello") || query.includes("hi")) {
                responseText = currentLang.startsWith('ne') ? 
                    "नमस्ते! म फ्ल्याक्सी एआई हुँ। आज म तपाईलाई कसरी सहयोग गर्न सक्छु?" : 
                    "Hello! Main Flaxxi AI hoon. Main aapki kya madad kar sakta hoon?";
            } 
            else {
                responseText = `Flaxxi AI Response:\nAapka question: "${input}". Main is baare mein aapki Help kar sakta hoon.`;
            }

            outputBox.value = responseText;
        }

        function toggleAudio() {
            if (isSpeaking) {
                stopAudio();
            } else {
                playAudio();
            }
        }

        function playAudio() {
            const text = document.getElementById('outputBox').value;
            if (!text) return alert("Read karne ke liye content nahi hai.");

            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(text);

            const voiceSelect = document.getElementById('voiceSelect');
            const selectedLang = document.getElementById('langSelect').value;

            if (voiceSelect.value !== "" && availableVoices[voiceSelect.value]) {
                speech.voice = availableVoices[voiceSelect.value];
            }
            speech.lang = selectedLang;

            speech.onend = () => stopAudio();
            speech.onerror = () => stopAudio();

            window.speechSynthesis.speak(speech);
            isSpeaking = true;

            document.getElementById('playIcon').className = 'fa-solid fa-square';
            document.getElementById('playText').innerText = 'Stop';
        }

        function stopAudio() {
            window.speechSynthesis.cancel();
            isSpeaking = false;
            document.getElementById('playIcon').className = 'fa-solid fa-play';
            document.getElementById('playText').innerText = 'Play';
        }

        function copyCode() {
            const outputBox = document.getElementById('outputBox');
            if(!outputBox.value) return alert("Pehle koi response generate hone dein!");
            outputBox.select();
            document.execCommand('copy');
            alert('Copied to Clipboard!');
        }

        function clearText() {
            stopAudio();
            document.getElementById('userInput').value = '';
            document.getElementById('outputBox').value = '';
            removeImage();
        }

        function startVoiceInput() {
            const recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!recognition) return alert("Browser voice input support nahi karta.");
            const rec = new recognition();
            rec.lang = document.getElementById('langSelect').value;
            const micIcon = document.getElementById('micIcon');
            micIcon.className = 'fa-solid fa-spinner fa-spin';

            rec.onresult = (e) => {
                document.getElementById('userInput').value = e.results[0][0].transcript;
                micIcon.className = 'fa-solid fa-microphone';
                processAIResponse();
            };
            rec.onerror = () => micIcon.className = 'fa-solid fa-microphone';
            rec.start();
        }
    </script>
</body>
</html>
