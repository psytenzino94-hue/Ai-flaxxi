<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flaxxi AI - User Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        .gold-border { border-color: #d97706; }
        .gold-text { color: #f59e0b; }
        .gold-btn { background: linear-gradient(135deg, #d97706, #b45309); }
        .gold-btn:hover { background: linear-gradient(135deg, #b45309, #92400e); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-lg bg-slate-800 rounded-2xl shadow-2xl border gold-border p-6 space-y-6">
        <!-- Header with Admin Button -->
        <div class="flex items-center justify-between border-b border-slate-700 pb-4">
            <h1 class="text-2xl font-bold gold-text flex items-center gap-2">
                <i class="fa-solid fa-bolt"></i> Flaxxi AI
            </h1>
            <div class="flex items-center gap-2">
                <a href="admin.html" class="text-slate-400 hover:text-amber-400 p-2 rounded-lg bg-slate-700/50 border border-slate-600" title="Open Admin Panel">
                    <i class="fa-solid fa-user-shield"></i>
                </a>
                <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-500/20">Online</span>
            </div>
        </div>

        <!-- Chat Input Area -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Apna Sawal Likhie</label>
                <textarea id="userInput" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 transition" placeholder="Type message..."></textarea>
            </div>

            <div class="flex gap-2">
                <button onclick="sendInstantMessage()" class="flex-1 gold-btn text-white font-semibold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> Ask Flaxxi
                </button>
                <button onclick="startVoiceInput()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-4 py-3 rounded-xl transition flex items-center justify-center gap-1" title="Voice Input">
                    <i class="fa-solid fa-microphone" id="micIcon"></i>
                </button>
                <button onclick="clearText()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 font-semibold px-4 py-3 rounded-xl transition">
                    Clear
                </button>
            </div>
        </div>

        <!-- Output Area with Speech -->
        <div class="space-y-2">
            <div class="flex items-center justify-between">
                <label class="block text-sm font-medium text-slate-400">Response</label>
                <button onclick="speakResponse()" class="text-amber-500 hover:text-amber-400 text-xs flex items-center gap-1 bg-amber-500/10 px-2 py-1 rounded border border-amber-500/20">
                    <i class="fa-solid fa-volume-high"></i> Read aloud
                </button>
            </div>
            <div id="outputBox" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 min-h-[100px] text-slate-200 whitespace-pre-line text-sm">
                Waiting for input...
            </div>
        </div>
    </div>

    <script>
        function sendInstantMessage() {
            const input = document.getElementById('userInput').value.trim();
            const outputBox = document.getElementById('outputBox');

            if (!input) {
                outputBox.innerText = "Kripya koi question type karein.";
                return;
            }

            let reply = "";
            const text = input.toLowerCase();

            if (text.includes("kisne banaya") || text.includes("who made you") || text.includes("who created you") || text.includes("tumhe kisne banaya")) {
                reply = "Mujhe Tenzino ne banaya hai!";
            } else if (text.includes("youtube") || text.includes("movie")) {
                reply = "YouTube jaisa application banane ke liye aapko HTML, CSS, aur JavaScript frontend, aur movie storage backend chahiye hoga. Tenzino ismein aapki help kar sakte hain.";
            } else if (text.includes("hello") || text.includes("hi")) {
                reply = "Namaste! Main Flaxxi AI hoon. Main aapki kya madad kar sakta hoon?";
            } else if (text.includes("name") || text.includes("naam")) {
                reply = "Mera naam Flaxxi AI hai!";
            } else {
                reply = `Flaxxi AI Answer: "${input}"\nIs sawal ka advanced jawab mere agle update mein aayega! Abhi main testing phase mein hoon.`;
            }

            outputBox.innerText = reply;
        }

        function clearText() {
            document.getElementById('userInput').value = '';
            document.getElementById('outputBox').innerText = 'Waiting for input...';
        }

        function startVoiceInput() {
            const recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!recognition) {
                alert("Aapka browser Speech Recognition ko support nahi karta hai.");
                return;
            }
            const rec = new recognition();
            rec.lang = 'hi-IN';
            const micIcon = document.getElementById('micIcon');
            micIcon.classList.remove('fa-microphone');
            micIcon.classList.add('fa-spinner', 'fa-spin');

            rec.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                document.getElementById('userInput').value = speechToText;
                micIcon.classList.remove('fa-spinner', 'fa-spin');
                micIcon.classList.add('fa-microphone');
                sendInstantMessage();
            };

            rec.onerror = function() {
                micIcon.classList.remove('fa-spinner', 'fa-spin');
                micIcon.classList.add('fa-microphone');
            };

            rec.start();
        }

        function speakResponse() {
            const text = document.getElementById('outputBox').innerText;
            if (!text || text === "Waiting for input...") return;
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'hi-IN';
            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
